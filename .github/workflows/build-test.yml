name: Test Build

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # fail instead of hanging for hours if a build step gets stuck
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and export
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: sharelatex-full:test
        # Build *with* the frontend rebuild, so that this job proves the whole
        # path works: restoring the devDependencies from the yarn cache, running
        # webpack against the registry in overlay/services/web/config, and
        # finding the module's component in the resulting bundle
        # (tests/verify-overlay.sh checks that). The published image is built by
        # docker-build.yml, which does not pass this argument - the rebuild is
        # opt-in, see DEVELOP_EXPERIMENT.MD, section "Rebuilding the frontend".
        build-args: |
          OVERLEAF_REBUILD_FRONTEND=true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/sharelatex-full.tar
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: sharelatex-full
        path: /tmp/sharelatex-full.tar
        retention-days: 1
  test:
    runs-on: ubuntu-latest
    needs: build
    # the verification and the MWE compiles each have their own timeout, this
    # one is the backstop for the job as a whole
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: sharelatex-full
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/sharelatex-full.tar
      - name: Verify the overlay
        run: docker run --rm --volume $(pwd)/tests:/tests --entrypoint=/bin/bash sharelatex-full:test -c "/bin/bash /tests/verify-overlay.sh"
      - name: Build MWEs
        run: docker run --rm --volume $(pwd)/tests:/tests --entrypoint=/bin/bash sharelatex-full:test -c "/bin/bash /tests/compile.sh"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ./tests/*/*.pdf
          retention-days: 7
