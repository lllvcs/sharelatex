name: Build Docker Image

# Build step: compiles the image once and stores it in GHCR under an immutable tag
#
#   ghcr.io/<owner>/<repo>:<channel>-<short-hash>   (+ the version, when known)
#
# That image is the hand-off artifact: run "Publish Docker Image" to copy it to
# Docker Hub and move the release tags, without rebuilding anything.
#
# This replaces two workflows (build-push-docker.yml and build-push-ghcr.yml)
# that each rebuilt the same multi-gigabyte image for a single registry — twice
# the build time on every release, and two jobs writing the same `type=gha` cache.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - canary
          - beta
          - stable
        default: stable
      version:
        description: 'Version (optional, e.g. 1.2.3)'
        type: string
        required: false
      platforms:
        description: 'Platforms passed to buildx (e.g. linux/amd64,linux/arm64)'
        type: string
        default: linux/amd64
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Serialise builds: two 7.6 GB builds racing the same `type=gha` cache evict
# each other's layers. Queue instead of cancelling, so a release build still runs.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Used by the buildx provenance attestation.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build of the LaTeX image takes tens of minutes; fail instead of
    # holding a runner for the six-hour default.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version and tag
        id: prepare
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL:-stable}"
          version="${INPUT_VERSION:-${RELEASE_TAG}}"
          # Release tags are conventionally `v1.2.3`; keep the bare version.
          version="${version#v}"
          git_short_hash=$(git rev-parse --short HEAD)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "git-short-hash=${git_short_hash}" >> "$GITHUB_OUTPUT"
          echo "tag=${channel}-${git_short_hash}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is provided by the run and needs the `packages: write`
          # permission declared above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the immutable tags: `latest` and the channel tag are moved by the
          # publish workflow, so that they never point at a half-published build.
          tags: |
            type=raw,value=${{ steps.prepare.outputs.tag }}
            type=raw,value=${{ steps.prepare.outputs.version }},enable=${{ steps.prepare.outputs.version != '' }}

      - name: Build and push the image to GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image metadata
        shell: bash
        env:
          TAG_SUFFIX: ${{ steps.prepare.outputs.tag }}
          CHANNEL: ${{ steps.prepare.outputs.channel }}
          VERSION: ${{ steps.prepare.outputs.version }}
          GIT_SHORT_HASH: ${{ steps.prepare.outputs.git-short-hash }}
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          mkdir -p ./image-meta
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(
              "./image-meta/image-meta.json",
              JSON.stringify(
                {
                  tag: process.env.TAG_SUFFIX,
                  channel: process.env.CHANNEL,
                  version: process.env.VERSION,
                  image: process.env.IMAGE,
                  digest: process.env.DIGEST,
                  platforms: process.env.PLATFORMS,
                  gitShortHash: process.env.GIT_SHORT_HASH,
                },
                null,
                2
              ) + "\n"
            );
          '
          {
            echo ""
            echo "### Built image"
            echo ""
            echo '```'
            echo "${IMAGE}:${TAG_SUFFIX}"
            echo "${IMAGE}:${VERSION:-<no version>}"
            echo "digest: ${DIGEST}"
            echo "platforms: ${PLATFORMS}"
            echo '```'
            echo ""
            echo "Next: run the **Publish Docker Image** workflow to copy it to Docker Hub and move the release tags."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image metadata
        # Small hand-off file: the publish workflow reads it to learn which tag
        # the most recent build produced.
        uses: actions/upload-artifact@v7
        with:
          name: image-meta
          path: ./image-meta
          if-no-files-found: error
          retention-days: 30
